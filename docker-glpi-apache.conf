# =============================================================================
# D3X — Configuration Apache pour GLPI 11
# =============================================================================
# GLPI 11 sert depuis public/ via un front controller unique (public/index.php)
# qui route en interne (Symfony Kernel) vers les bons contrôleurs, y compris
# l'installeur (install/install.php, en dehors de public/, exposé via la
# route /install/install.php gérée par le Kernel).
#
# Comme GLPI ne fournit pas de .htaccess, les règles de réécriture et
# d'autorisation sont injectées directement dans le vhost (plus robuste
# qu'un .htaccess, pas besoin d'AllowOverride).
# =============================================================================
<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/glpi/public

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    <Directory /var/www/glpi/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        RewriteEngine On

        # Si le fichier/dossier demandé existe réellement dans public/, le servir tel quel
        RewriteCond %{REQUEST_FILENAME} -f [OR]
        RewriteCond %{REQUEST_FILENAME} -d
        RewriteRule ^ - [L]

        # Sinon, tout rediriger vers le front controller (Symfony Kernel),
        # qui route en interne vers install/, front/, ajax/, etc.
        RewriteRule ^ index.php [QSA,L]
    </Directory>
</VirtualHost>
